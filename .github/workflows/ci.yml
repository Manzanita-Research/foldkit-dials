name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    # Fork PRs run on GitHub's free runner, so a stranger's PR never spends
    # Blacksmith minutes. Same-repo PRs and main run on Blacksmith.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tooling/lint/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The linter has its own lockfile, outside the package's dependencies.
      - run: pnpm install --frozen-lockfile
        working-directory: tooling/lint
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:demo
      # The npm package: build it, and list the files `npm publish` would ship.
      - run: npm run build && npm pack --dry-run
        working-directory: packages/foldkit-dials
      - run: node tooling/check-panel-types.mjs
