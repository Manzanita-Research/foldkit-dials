name: Deploy

# Deploys the demo to one Cloudflare Worker, `foldkit-dials`, with wrangler:
# - A push to main deploys production, at https://foldkit-dials.manzanita.dev.
# - A pull request from this repository uploads a version of the same Worker
#   that takes no traffic, with the preview alias `pr-<n>`, and comments its
#   URL on the PR. Each push re-points the alias.
# Cloudflare can't delete versions, so nothing runs when a PR closes.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# One deploy per PR, or for main, at a time; a newer push waits rather than
# cancelling a deploy halfway.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    # Fork PRs get no secrets, so only this repository's own branches deploy.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:demo

      - name: Deploy production
        if: github.event_name == 'push'
        run: pnpm exec wrangler deploy

      - name: Upload a preview version
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          pnpm exec wrangler versions upload --preview-alias "pr-$PULL_REQUEST" --message "PR #$PULL_REQUEST at ${HEAD_SHA::7}"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler did not report a preview alias URL."
            exit 1
          fi
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="## Demo preview

          $PREVIEW_URL

          Built from ${HEAD_SHA::7}. It's a version of the \`foldkit-dials\` Worker that takes no traffic. This comment updates on every push."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Demo preview"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
